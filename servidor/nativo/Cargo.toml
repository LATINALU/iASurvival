[package]
name = "ias_nativo"
version = "0.1.0"
edition = "2021"
description = "Núcleo nativo de iASurvival (WebAssembly): ruido del terreno y A* sobre la grilla grande."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
